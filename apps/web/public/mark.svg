<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="M4">
  <!--
    The M4 product mark: the wordmark from docs/assets/banner.svg, cropped square
    and reduced to what stays legible at icon scale. The banner's grid, orbits and
    node graph are deliberately dropped — at 32px they read as noise. The
    background, wordmark and glow gradients are the banner's, unchanged.
  -->
  <defs>
    <clipPath id="m4MarkClip"><rect width="256" height="256" rx="56"/></clipPath>
    <linearGradient id="m4MarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A11"/><stop offset="100%" stop-color="#04060B"/>
    </linearGradient>
    <linearGradient id="m4MarkWord" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="52%" stop-color="#A9C7FF"/><stop offset="100%" stop-color="#3D6FE0"/>
    </linearGradient>
    <radialGradient id="m4MarkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2C5AE0" stop-opacity="0.42"/><stop offset="100%" stop-color="#2C5AE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#m4MarkClip)">
    <rect width="256" height="256" fill="url(#m4MarkBg)"/>
    <ellipse cx="128" cy="120" rx="150" ry="130" fill="url(#m4MarkGlow)"/>
    <circle cx="128" cy="128" r="104" fill="none" stroke="#6E9BFF" stroke-opacity="0.16"/>
  </g>

  <text x="128" y="172" text-anchor="middle" fill="url(#m4MarkWord)"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="118" font-weight="700" letter-spacing="-4">M4</text>
</svg>
