name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both jobs run against a real PostgreSQL. The integration tests exercise
  # session handling, throttling and — most importantly — tenant isolation,
  # none of which a mocked client would prove anything about.
  DATABASE_URL: postgresql://m4:m4@localhost:5432/m4?schema=public
  SKIP_ENV_VALIDATION: "true"

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: m4
          POSTGRES_PASSWORD: m4
          POSTGRES_DB: m4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m4 -d m4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # setup-node's built-in pnpm cache requires a lockfile to exist, which
      # is not true on a bootstrap run. Cache the pnpm store directly instead.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # pnpm turns on --frozen-lockfile by itself in CI once pnpm-lock.yaml is
      # committed, so this stays correct after the first install.
      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      # Neither lint, typecheck nor the tests notice server-only code reaching a
      # Client Component — the build is what fails, because it tries to send
      # Prisma and node-postgres to the browser. Since the server boundary is a
      # stated invariant with no other automated guard, the build is that guard.
      - name: Production build
        run: pnpm build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: m4
          POSTGRES_PASSWORD: m4
          POSTGRES_DB: m4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U m4 -d m4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # setup-node's built-in pnpm cache requires a lockfile to exist, which
      # is not true on a bootstrap run. Cache the pnpm store directly instead.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # pnpm turns on --frozen-lockfile by itself in CI once pnpm-lock.yaml is
      # committed, so this stays correct after the first install.
      - name: Install dependencies
        run: pnpm install

      # `db:deploy` only applies migrations. `db:push`, which this replaced,
      # generated the client as a side effect — so generating it has to be said
      # out loud here, as the verify job already does.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Install Playwright browsers
        run: pnpm --filter @m4/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          OPENAI_API_KEY: test
          GEMINI_API_KEY: test
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
