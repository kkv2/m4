name: m4

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: m4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: m4
      POSTGRES_PASSWORD: m4
      POSTGRES_DB: m4
    ports:
      - "5432:5432"
    volumes:
      - m4-postgres-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m4 -d m4"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  m4-postgres-data:
